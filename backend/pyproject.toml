[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "start-backend"
version = "0.1.0"
description = "Local Transcript Service - Live transcription backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0.3",
    "yt-dlp>=2024.8.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.13.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]
diarization = [
    "pyannote.audio>=4.0.0,<5.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
